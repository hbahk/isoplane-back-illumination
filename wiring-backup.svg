<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#21414d;font-size:18px}.box{fill:#edf6f8;stroke:#488591;stroke-width:2}.line{fill:none;stroke:#b26c32;stroke-width:3}</style><rect width="1100" height="660" fill="white"/><text x="40" y="50" style="font-size:28px;font-weight:bold">백업 암 · PTFE + LED 2개 / 개념 배선도</text><text x="40" y="88">24V 면광원용 케이블과 다른 모양의 커넥터를 사용합니다.</text><rect class="box" x="40" y="150" width="170" height="90" rx="8"/><text x="65" y="185">5V DC 전원</text><text x="65" y="215">LED 전원 분기</text><rect class="box" x="330" y="120" width="160" height="70" rx="8"/><text x="365" y="162">저항 R1</text><rect class="box" x="330" y="240" width="160" height="70" rx="8"/><text x="365" y="282">저항 R2</text><rect class="box" x="600" y="120" width="160" height="70" rx="8"/><text x="640" y="162">LED 1</text><rect class="box" x="600" y="240" width="160" height="70" rx="8"/><text x="640" y="282">LED 2</text><rect class="box" x="865" y="150" width="195" height="130" rx="8"/><text x="885" y="188">LED 구동 스위치</text><text x="885" y="220">5V 로직 MOSFET</text><text x="885" y="252">기본 OFF</text><path class="line" d="M210 195H260V155H330M260 195V275H330M490 155H600M490 275H600M760 155H805V205H865M760 275H805V205M965 280V425H130V240"/><text x="870" y="452">공통 GND</text><rect class="box" x="420" y="360" width="210" height="95" rx="8"/><text x="450" y="398">Arduino Nano</text><text x="450" y="429">점등 / 소등 명령</text><path class="line" d="M630 390H835V240H865"/><text x="40" y="510">R=(5V−LED 순방향 전압)/목표 전류. 각 LED에 각각 저항을 둡니다.</text><text x="40" y="544">예: 순방향3.2V, 10mA이면180Ω. 실제 LED의 데이터시트를 확인해 확정합니다.</text><text x="40" y="578">MOSFET 모듈의 핀 배치·게이트 기본 OFF 구성은 선택한 부품에 맞춰 확인합니다.</text><text x="40" y="612">면광원 ILZ용 24V / 0–10V 제어부와 직접 연결하지 않습니다. 실제 핀 결선도는 미확정입니다.</text></svg>