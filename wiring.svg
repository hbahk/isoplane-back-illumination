<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#203e49} .h{font-size:26px;font-weight:bold}.t{font-size:17px}.s{font-size:14px}.b{fill:#eef6f8;stroke:#43818d;stroke-width:2}.w{fill:none;stroke:#bd5c44;stroke-width:3}.g{fill:none;stroke:#567a8b;stroke-width:2}</style><rect width="1200" height="800" fill="#fff"/><text x="40" y="45" class="h">v10 · 면광원 직접 구동 — 전원·신호 구성도</text><text x="40" y="76" class="s">부품 핀 번호를 확정한 제작 배선도가 아닙니다. 보유 ILZ 하네스·드라이버 모듈·스위치 단자를 확인 후 결선합니다.</text>
<rect class="b" x="40" y="125" width="210" height="90" rx="10"/><text class="t" x="60" y="158">24V DC 전원</text><text class="s" x="60" y="188">±5% / 광원 전용</text>
<rect class="b" x="330" y="125" width="245" height="90" rx="10"/><text class="t" x="350" y="158">퓨즈 + 기본 OFF 전원 스위치</text><text class="s" x="350" y="188">DC 부하용 릴레이 등 / 정격 선정</text>
<rect class="b" x="670" y="125" width="215" height="90" rx="10"/><text class="t" x="690" y="158">기존 ILZ 드라이버</text><text class="s" x="690" y="188">고정부에 배치 / 케이블 연결 확인</text>
<rect class="b" x="950" y="125" width="210" height="90" rx="10"/><text class="t" x="965" y="158">MB-TBL2X2-B</text><text class="s" x="965" y="188">이동 면광원 / 470 nm</text>
<path class="w" d="M250 170H330M575 170H670M885 170H950"/>
<rect class="b" x="40" y="300" width="210" height="90" rx="10"/><text class="t" x="60" y="333">12V DC 전원 + 퓨즈</text><text class="s" x="60" y="363">기동·구속전류 확인 후 용량 선정</text>
<rect class="b" x="330" y="300" width="245" height="90" rx="10"/><text class="t" x="350" y="333">모터 드라이버 H 브리지</text><text class="s" x="350" y="363">DRV8871 검토 / 정·역회전</text>
<rect class="b" x="670" y="300" width="245" height="90" rx="10"/><text class="t" x="690" y="333">LM2370 / 12V / 150 mm</text><text class="s" x="690" y="363">2선 / 내장 양 끝 리미트</text><path class="w" d="M250 345H330M575 345H670"/>
<rect class="b" x="40" y="500" width="210" height="90" rx="10"/><text class="t" x="60" y="533">5V DC 전원</text><text class="s" x="60" y="563">12V→5V 변환 / USB 역급전 방지</text>
<rect class="b" x="330" y="500" width="245" height="90" rx="10"/><text class="t" x="350" y="533">Arduino Nano</text><text class="s" x="350" y="563">PC 명령 / 센서 확인 / 시간 초과</text><path class="w" d="M250 545H330"/><path class="g" d="M450 500V390"/>
<rect class="b" x="670" y="500" width="245" height="90" rx="10"/><text class="t" x="690" y="533">IN / OUT / 점검창 센서</text><text class="s" x="690" y="563">외부 flag / NC 회로 검토</text><path class="g" d="M670 545H575"/>
<rect class="b" x="950" y="500" width="210" height="90" rx="10"/><text class="t" x="970" y="533">0–10V 밝기 제어부</text><text class="s" x="970" y="563">출력0V 기본 / 모듈 미선정</text><path class="g" d="M575 577H630V640H1055V590M1055 500V260H780V215M395 500V445H610V245H450V215"/>
<text class="s" x="40" y="690">• 센서/로직 GND와 드라이버 신호 기준은 해당 모듈 설명서대로 연결합니다. 24V·12V를 Nano 입력에 넣지 않습니다.</text><text class="s" x="40" y="717">• IN 확인 + 정지 + 점검창 닫힘일 때만 점등. 이동 전 소등. 회수 방향은 IN 센서 작동 후에도 허용하도록 설계합니다.</text><text class="s" x="40" y="744">• 정지 감지는 flag가 스위치를 누르는 방식입니다. 스위치가 하중을 받는 물리적 스토퍼가 되어서는 안 됩니다.</text><text class="s" x="40" y="771">• ILZ는 0–10V 밝기 입력 사양입니다. TTL 트리거 제품으로 간주하지 않으며, Nano PWM을 직접 연결하지 않습니다.</text></svg>