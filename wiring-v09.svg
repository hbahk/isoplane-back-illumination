<svg xmlns="http://www.w3.org/2000/svg" width="840" height="730" viewBox="0 0 840 730" role="img" aria-label="12V 전원, 모터 드라이버, LED, 센서의 기능 연결도">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#5b7180"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#24424f;font-size:16px}.small{font-size:14px;fill:#526b77}.box{fill:#f0f6f8;stroke:#b8cfd7;stroke-width:1.5}.wire{fill:none;stroke:#5b7180;stroke-width:2;marker-end:url(#arr)}.motor{stroke:#b55259}.led{stroke:#ca8a20}.sense{stroke:#9469b3}</style>
<rect width="840" height="730" fill="white"/>
<text x="24" y="30" font-size="20" font-weight="650">기능 연결도 — 보드 단자 번호·보호소자 정격은 미확정</text>
<rect class="box" x="24" y="54" width="190" height="66" rx="7"/><text x="42" y="82">인증된 12 V DC 전원</text><text class="small" x="42" y="105">AC 배선은 제어함 밖</text>
<path class="wire" d="M214 87H257"/><rect class="box" x="260" y="54" width="228" height="66" rx="7"/><text x="278" y="82">퓨즈 · 전체 전원 차단</text><text class="small" x="278" y="105">퓨즈값: 기동/고착 전류 확인 후</text>
<path class="wire motor" d="M488 87H585V171"/>
<rect class="box" x="469" y="173" width="230" height="74" rx="7"/><text x="485" y="201">H-브리지 · 전류 제한</text><text class="small" x="485" y="225">모터 전류 측정 / 방향 제어</text>
<path class="wire motor" d="M699 196H760V295H685"/>
<rect class="box" x="469" y="266" width="214" height="70" rx="7"/><text x="485" y="295">J1 → 액추에이터 M1/M2</text><text class="small" x="485" y="319">2선 / 내장 끝단 정지 별도 확인</text>
<path class="wire" d="M315 120V172"/>
<rect class="box" x="200" y="174" width="195" height="66" rx="7"/><text x="219" y="202">DC–DC → 5 V</text><text class="small" x="219" y="226">제어기 전압은 보드에 맞춤</text>
<path class="wire led" d="M260 240V268H153V367"/>
<rect class="box" x="24" y="370" width="282" height="85" rx="7"/><text x="42" y="398">LED A: +5 V → R1 → LED A+</text><text x="42" y="422">LED B: +5 V → R2 → LED B+</text><text class="small" x="42" y="443">J2 4핀 / 각각의 LED 음극은 스위치로</text>
<path class="wire led" d="M153 455V483"/>
<rect class="box" x="24" y="486" width="282" height="70" rx="7"/><text x="42" y="514">LED A−, B− → MOSFET → GND</text><text class="small" x="42" y="539">게이트 풀다운 / 전원 켤 때 기본 소등</text>
<rect class="box" x="26" y="173" width="142" height="141" rx="7"/><text x="44" y="204">제어기</text><text class="small" x="44" y="230">삽입 / 후퇴 명령</text><text class="small" x="44" y="253">IN / OUT 확인</text><text class="small" x="44" y="276">타임아웃 / 고장</text><text class="small" x="44" y="299">점등 요청</text>
<path class="wire" d="M200 201H170"/>
<path class="wire" d="M168 290H353V355H410"/>
<rect class="box" x="412" y="350" width="386" height="93" rx="7"/><text x="430" y="379">방향별 하드웨어 차단 + LED 허용 논리</text><text class="small" x="430" y="403">IN 작동 → 추가 삽입 금지 / OUT 작동 → 추가 후퇴 금지</text><text class="small" x="430" y="428">허용된 반대 방향으로 복귀 가능 / 고장 시 자동 재시작 금지</text>
<path class="wire" d="M444 351V209H468"/>
<path class="wire led" d="M412 423H347V520H307"/>
<text class="small" x="418" y="465">차광 덮개 열림 → 모터 정지 · LED 소등 · 관측 금지</text>
<rect class="box" x="412" y="484" width="386" height="99" rx="7"/><text x="430" y="514">J3 · IN / OUT / 차광 덮개 — NC 접점 루프</text><text class="small" x="430" y="538">센서 → 논리 입력 / 접점으로 모터 전류를 직접 끊지 않음</text><text class="small" x="430" y="562">제어기에도 상태 전달 / 센서 단선은 허용 해제로 처리</text>
<path class="wire sense" d="M602 484V444"/>
<path class="wire sense" d="M412 550H366V329H100V315"/>
<path class="wire" d="M24 618H798"/><text class="small" x="24" y="643">비절연 회로 기준: 12 V 리턴 · DC–DC · 제어기 · 드라이버 · LED GND를 공통 기준점에 연결.</text>
<text class="small" x="24" y="667">모터 전류 리턴은 센서선·LED 리턴과 분리 배선 후 전원 기준점에서 합류. USB 전원 역급전은 방지.</text>
<text class="small" x="24" y="695">예시 R1=R2=1.5 kΩ: 적색 LED Vf≈2 V일 때 각각 약 2 mA. LED 사양과 필요한 밝기에 맞춰 확정.</text>
<text class="small" x="24" y="720">모터 전류 제한은 광학계 접촉 보호의 보증이 아님. 전원·부품·케이블 정격과 인터록 회로는 실물 시험 필요.</text>
</svg>
